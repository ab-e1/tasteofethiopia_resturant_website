<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="badgeClip">
      <rect x="2" y="2" width="116" height="116" rx="20" ry="20" />
    </clipPath>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" floodColor="#000000" floodOpacity="0.35" />
    </filter>
  </defs>
  <g clipPath="url(#badgeClip)">
    <rect x="0" y="0" width="120" height="40" fill="#1E6B38" />
    <rect x="0" y="40" width="120" height="40" fill="#D49B0E" />
    <rect x="0" y="80" width="120" height="40" fill="#8A2C18" />
    <line x1="0" y1="40" x2="120" y2="40" stroke="#000000" stroke-opacity="0.1" stroke-width="1" />
    <line x1="0" y1="80" x2="120" y2="80" stroke="#000000" stroke-opacity="0.1" stroke-width="1" />
    <text x="60" y="27" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="2.5" filter="url(#textShadow)">TASTE</text>
    <text x="60" y="66" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" letter-spacing="3" filter="url(#textShadow)">OF</text>
    <text x="60" y="105" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" letter-spacing="1.8" filter="url(#textShadow)">ETHIOPIA</text>
  </g>
  <rect x="2" y="2" width="116" height="116" rx="20" ry="20" fill="none" stroke="#E2D9CC" stroke-width="2" stroke-opacity="0.9" />
</svg>
